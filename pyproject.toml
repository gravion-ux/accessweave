[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessweave"
version = "0.2.0"
description = "Offline identity-relationship and directory-permission review from explicitly exported inventory data."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
accessweave = "accessweave.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
